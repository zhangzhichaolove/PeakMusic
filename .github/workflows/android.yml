name: Android verification

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - name: Test, lint, and build both variants
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest --console=plain
      - name: Release archive policy tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify signing and version configuration using a disposable certificate
        run: python3 scripts/verify-release-config.py
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/verification/release-config/*.txt
          retention-days: 7
      - name: Preserve unsigned release and debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks-not-for-production-signing
          path: app/build/outputs/apk/
          retention-days: 7

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [33, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK and synthetic media generator
        run: |
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native regression and actual minified Release smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-port: 5580
          disable-animations: true
          script: scripts/verify-native-ci.sh emulator-5580
      - name: Retain native logs and screenshots, not test-signed APKs or preference snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-api-${{ matrix.api }}
          path: |
            app/build/verification/**/*.txt
            app/build/verification/**/*.png
            !app/build/verification/**/mapping.txt
          retention-days: 14
